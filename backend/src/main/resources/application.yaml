spring:
  application:
    name: intel
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/upi_expense_intel}
    username: ${DB_USERNAME:upi_expense}
    password: ${DB_PASSWORD:upi_expense}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:9090}
  forward-headers-strategy: framework

logging:
  level:
    com.upiexpense.intel.transaction.CategorizationService: DEBUG
    com.upiexpense.intel.transaction.TransactionService: DEBUG
    com.upiexpense.intel.rule.MerchantRuleService: DEBUG

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-before-production}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  uploads:
    storage-path: ${UPLOAD_STORAGE_PATH:./data/uploads}
