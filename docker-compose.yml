services:
  postgres:
    image: postgres:16-alpine
    container_name: upi-expense-intel-postgres
    environment:
      POSTGRES_DB: upi_expense_intel
      POSTGRES_USER: upi_expense
      POSTGRES_PASSWORD: upi_expense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upi_expense -d upi_expense_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
